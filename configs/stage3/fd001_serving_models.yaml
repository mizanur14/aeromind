# Regenerate the FD001 servable bundles locally WITHOUT the 5-fold CV (canonical fold only, ~5 min on CPU).
# Same models, hyperparameters, seeds and split as configs/stage2/fd001_comparison.yaml.
# Bundles are re-trained, so their SHA-256 differs from the published registry: point
# configs/stage3/registry.yaml at the new run directory and rebuild with 'aeromind s3-registry'.
# CV metrics in a rebuilt registry are then absent for this source (canonical metrics only).
name: s3_fd001_serving_models
dataset: FD001
seed: 42
target_cap: 125
evaluation:
  snapshots_per_engine: 10
  snapshot_seed: 42
  capped_truth_cap: 125
  near_eol_threshold: 30
  rul_bins: [0, 25, 50, 75, 100, 125, 150, 200, 400]
cv: {folds: 5, seed: 42, include_canonical: true, run_folds: [canonical]}
latency_repeats: 30
reference_model: hgb_reference

models:
  ridge:
    kind: classical
    family: ridge
    params: {alpha: 0.1}
    features: {windows: [10, 30]}
  xgboost:
    kind: classical
    family: xgboost
    params: {n_estimators: 300, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, max_depth: 5, min_child_weight: 5, n_jobs: 4}
    features: {windows: [10, 30]}
  hgb_reference:        # Stage-1 validation-selected reference (not a proven superior architecture)
    kind: classical
    family: hist_gradient_boosting
    params: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 15, min_samples_leaf: 20}
    features: {windows: [10, 30]}
  tcn:
    kind: deep
    deep: &deep_common
      arch: tcn
      window: 30
      net: {channels: 32, levels: 3, kernel: 3, dropout: 0.1}
      features: {windows: [], stats: []}       # raw normalised sensors + cycle per time step
      train: {epochs: 40, batch_size: 256, lr: 0.001, weight_decay: 0.0001, loss: huber, huber_delta: 10.0,
              patience: 8, scheduler: plateau, grad_clip: 1.0, inner_val_fraction: 0.15, threads: 4}
  gru:
    kind: deep
    deep:
      <<: *deep_common
      arch: gru
      net: {hidden: 64, layers: 1, dropout: 0.1}
  transformer:
    kind: deep
    deep:
      <<: *deep_common
      arch: transformer
      net: {d_model: 32, heads: 4, layers: 2, ff: 64, dropout: 0.1}
