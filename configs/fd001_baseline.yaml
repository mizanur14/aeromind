# FD001 Stage-1 baseline: piecewise-capped target (125), all six model families.
# Pre-registered as the primary experiment (cap chosen a priori from literature convention,
# not tuned on the official test set).
name: fd001_baseline
dataset: FD001
seed: 42

paths:
  raw_dir: data/raw/cmapss
  processed_dir: data/processed
  manifest_dir: data/manifests
  artifacts_dir: artifacts/runs
  reports_dir: reports

split:
  seed: 42
  fractions: [0.70, 0.15, 0.15]

target:
  cap: 125            # training target = min(RUL, 125); null = uncapped

features:
  sensors: all        # constant sensors are removed by the fitted pipeline (train engines only)
  include_settings: false
  include_cycle: true
  windows: [10, 30]   # trailing windows; partial windows (min_periods=1) for early cycles
  stats: [mean, std, slope, min, max]
  include_diff: false
  drop_constant: true
  constant_tol: 1.0e-8
  scaler: standard
  condition_normalization: false   # FD001 has a single operating condition
  n_conditions: 1

evaluation:
  snapshots_per_engine: 10         # engine-equal validation snapshots
  snapshot_seed: 42
  capped_truth_cap: 125            # for "_capped" (literature-style) metrics
  near_eol_threshold: 30
  rul_bins: [0, 25, 50, 75, 100, 125, 150, 200, 400]
  selection_metric: snapshot_rmse_target
  latency_repeats: 50

training:
  sample_weight: none
  n_jobs: 4

models:
  median: {}
  mean_residual_life:
    params: {min_engines: 5}
  ridge:
    grid:
      alpha: [0.1, 1.0, 10.0, 100.0]
  random_forest:
    params: {n_estimators: 200, max_features: 0.33}
    grid:
      max_depth: [12, null]
      min_samples_leaf: [5, 20]
  hist_gradient_boosting:
    params: {max_iter: 300}
    grid:
      learning_rate: [0.05, 0.1]
      max_leaf_nodes: [15, 31]
      min_samples_leaf: [20]
  xgboost:
    params: {n_estimators: 300, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}
    grid:
      max_depth: [3, 5]
      min_child_weight: [5]
